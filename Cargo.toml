[workspace]
members = [
    "crates/lux-core",
    "crates/lux-image",
    "crates/lux-video",
    "crates/lux-edit",
    "crates/lux-gui",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Larvance"]
license = "MIT"
repository = "https://github.com/larvance/luxviewer"

[workspace.dependencies]
# Workspace internal crates
lux-core = { path = "crates/lux-core" }
lux-image = { path = "crates/lux-image" }
lux-video = { path = "crates/lux-video" }
lux-edit = { path = "crates/lux-edit" }

# Serialization & Logging
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

# Concurrency & Async
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "fs"] }
rayon = "1.10"
crossbeam-channel = "0.5"

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "ico", "bmp", "avif", "tiff"] }
imageproc = "0.25"
fast_image_resize = "5.1"
resvg = "0.44"
tiny-skia = "0.11"
exif = { package = "kamadak-exif", version = "0.5" }

# Filesystem & Utils
lru = "0.12"
walkdir = "2.5"
mime_guess = "2.0"
natord = "1.0"
directories = "5.0"
