[workspace]
members = [
    "crates/vex-core",
    "crates/vex-image",
    "crates/vex-video",
    "crates/vex-edit",
    "crates/vex-gui",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Larvance"]
license = "MIT"
repository = "https://github.com/aerovexhq/vexview"

[workspace.dependencies]
# Workspace internal crates
vex-core = { path = "crates/vex-core" }
vex-image = { path = "crates/vex-image" }
vex-video = { path = "crates/vex-video" }
vex-edit = { path = "crates/vex-edit" }

# Serialization & Logging
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

# Concurrency & Async
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "fs", "net", "io-util"] }
rayon = "1.10"
crossbeam-channel = "0.5"

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "ico", "bmp", "avif", "tiff"] }
imageproc = "0.25"
fast_image_resize = "5.1"
resvg = "0.44"
tiny-skia = "0.11"
exif = { package = "kamadak-exif", version = "0.5" }

# Filesystem & Utils
lru = "0.12"
walkdir = "2.5"
mime_guess = "2.0"
natord = "1.0"
directories = "5.0"

[profile.dev]
opt-level = 0
debug = 0
strip = "symbols"
incremental = false
codegen-units = 1

[profile.test]
opt-level = 1
debug = 0
strip = "symbols"
incremental = false
codegen-units = 1

[profile.release]
opt-level = 3
debug = 0
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
incremental = false
