<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Vibrant Glowing Amber Gradient -->
    <linearGradient id="amberCore" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="20%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Radiant Precision Rim Stroke -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.90"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.90"/>
    </linearGradient>

    <!-- Inner Bevel Highlight -->
    <linearGradient id="innerBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Elevated App Icon Shadow -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.40"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#iconShadow)">
    <!-- Base Hexagon -->
    <polygon points="480,256 368,450 144,450 32,256 144,62 368,62"
             fill="url(#amberCore)"
             stroke="url(#goldRim)"
             stroke-width="12"
             stroke-linejoin="round"/>

    <!-- Subtle Inner Bevel for Tactile Depth -->
    <polygon points="474,256 365,445 147,445 38,256 147,67 365,67"
             fill="url(#innerBevel)"
             stroke="rgba(255, 255, 255, 0.2)"
             stroke-width="1"
             stroke-linejoin="round"/>
  </g>
</svg>